<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIGNIA Q — Entrenamiento en equipo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#f4f6f8; margin:0; padding:24px; color:#222; }
  .card { background:#fff; border-radius:12px; padding:20px 24px; max-width:560px; margin:0 auto 16px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
  h1 { font-size:20px; margin:0 0 4px; color:#1F6FB2; }
  h2 { font-size:16px; margin:0 0 8px; }
  .muted { color:#666; font-size:14px; }
  label { display:block; margin:12px 0 4px; font-size:14px; font-weight:600; }
  input, textarea, select { width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:14px; font-family:inherit; }
  button { margin-top:16px; background:#1F6FB2; color:#fff; border:none; padding:10px 18px; border-radius:6px; font-size:15px; cursor:pointer; }
  button.secondary { background:#eee; color:#333; margin-left:8px; }
  button:disabled { background:#999; }
  .ok { color:#0F6E56; font-weight:600; }
  .err { color:#993C1D; }
  .topbar { max-width:560px; margin:0 auto 8px; display:flex; justify-content:space-between; align-items:center; }
  .topbar span { font-size:13px; color:#666; }
  .topbar button { margin:0; padding:4px 10px; font-size:13px; }
  iframe.visor { width:100%; height:420px; border:1px solid #ddd; border-radius:8px; margin-top:8px; }
  .badge { display:inline-block; background:#EAF3FB; color:#1F6FB2; font-size:12px; padding:2px 8px; border-radius:10px; margin-left:6px; }
</style>
</head>
<body>

<div id="topbar" class="topbar" style="display:none">
  <span id="usuarioActivo"></span>
  <button class="secondary" onclick="cerrarSesion()">Cerrar sesión</button>
</div>
<div id="app" class="card">Cargando…</div>

<script>
// =====================================================================
// Configura estos dos valores con los de tu proyecto Supabase (gratis)
// Project Settings -> API
// =====================================================================
const SUPABASE_URL = "https://fxjryfnbtlsxlxtoyuru.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_80ftUn5e24ccuFfTTsHGdg_tMTp56_8";
// =====================================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const topbar = document.getElementById("topbar");
const usuarioActivoSpan = document.getElementById("usuarioActivo");

// Este es el codigo que la etiqueta NFC entrega en la URL, ej:
// https://tu-sitio.github.io/index.html?equipo=EQLAB001
const params = new URLSearchParams(window.location.search);
const equipoId = params.get("equipo");

// -------------------- INICIO --------------------

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    mostrarLogin();
  } else {
    const usuario = localStorage.getItem("insignia_usuario") || session.user.email.split("@")[0];
    topbar.style.display = "flex";
    usuarioActivoSpan.textContent = `Sesión: ${usuario}`;
    cargarEquipo(usuario);
  }
}

// -------------------- AUTENTICACIÓN --------------------
// El alumno ve "usuario / contraseña". Por dentro se traduce a un correo
// interno (no real) porque Supabase Auth exige ese formato. El alumno
// nunca ve ni necesita un correo de verdad, ni tiene cuenta en Supabase:
// su cuenta vive dentro de esta app.

function correoInterno(usuario) {
  return `${usuario.trim().toLowerCase()}@insignia.local`;
}

function mostrarLogin(mensaje) {
  topbar.style.display = "none";
  app.innerHTML = `
    <h1>Iniciar sesión</h1>
    <p class="muted">Ingresa tu usuario y contraseña para continuar${equipoId ? ` con el equipo <strong>${equipoId}</strong>` : ""}.</p>
    <label>Usuario (código de alumno)</label>
    <input id="usuario" placeholder="ej. A0001">
    <label>Contraseña</label>
    <input id="password" type="password">
    <button id="btnLogin">Iniciar sesión</button>
    <button id="btnSignup" class="secondary">Crear cuenta</button>
    <p id="msg">${mensaje ? `<span class="err">${mensaje}</span>` : ""}</p>
  `;
  document.getElementById("btnLogin").onclick = () => autenticar("login");
  document.getElementById("btnSignup").onclick = () => autenticar("signup");
}

async function autenticar(modo) {
  const usuario = document.getElementById("usuario").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  if (!usuario || !password) {
    msg.innerHTML = `<span class="err">Completa usuario y contraseña.</span>`;
    return;
  }
  if (password.length < 6) {
    msg.innerHTML = `<span class="err">La contraseña debe tener al menos 6 caracteres.</span>`;
    return;
  }

  const email = correoInterno(usuario);
  const { error } = modo === "signup"
    ? await supabase.auth.signUp({ email, password })
    : await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    msg.innerHTML = `<span class="err">${error.message}</span>`;
    return;
  }

  if (modo === "signup") {
    msg.innerHTML = `<span class="ok">Cuenta creada. Presiona "Iniciar sesión" para continuar.</span>`;
    return;
  }

  localStorage.setItem("insignia_usuario", usuario);
  init();
}

async function cerrarSesion() {
  await supabase.auth.signOut();
  localStorage.removeItem("insignia_usuario");
  init();
}

// -------------------- EQUIPO + PRÁCTICA --------------------

async function cargarEquipo(codigoAlumno) {
  if (!equipoId) {
    app.innerHTML = `<p class="err">No se recibió el código del equipo. Acércate al equipo con el celular para leer su etiqueta NFC.</p>`;
    return;
  }

  const { data: equipo, error: errEquipo } = await supabase
    .from("equipos").select("*").eq("codigoEq", equipoId).single();

  if (errEquipo || !equipo) {
    app.innerHTML = `<p class="err">No se encontró información para el equipo "${equipoId}".</p>`;
    return;
  }

  const { data: practica } = await supabase
    .from("practicas").select("*").eq("codigoEq", equipoId).single();

  const { data: materiales } = await supabase
    .from("material_didactico").select("*");

  // --- Tarjeta de información del equipo ---
  app.innerHTML = `
    <h1>${equipo.tipo} <span class="badge">${equipo.codigoEq}</span></h1>
    <p class="muted">${equipo.marca || ""} ${equipo.modelo || ""}</p>
    ${equipo.manual_url ? `
      <label>Manual del equipo</label>
      <iframe class="visor" src="${equipo.manual_url}"></iframe>
    ` : `<p class="muted">Este equipo no tiene manual PDF cargado todavía.</p>`}
  `;

  if (!practica) {
    app.innerHTML += `<p class="muted">Este equipo no tiene una práctica asignada.</p>`;
    return;
  }

  // --- Tarjeta de la práctica / formulario ---
  const opcionesMaterial = (materiales || [])
    .map(m => `<option value="${m.codMat}">${m.nombre}</option>`)
    .join("");

  const formCard = document.createElement("div");
  formCard.className = "card";
  formCard.innerHTML = `
    <h2>${practica.nombre}</h2>
    <p class="muted">${practica.instrucciones || ""}</p>

    <label>Material didáctico utilizado</label>
    <select id="material">
      <option value="">— Selecciona —</option>
      ${opcionesMaterial}
    </select>

    <label>Datos obtenidos en el experimento</label>
    <textarea id="datos" rows="3" placeholder="ej. pH = 7.02"></textarea>

    <label>Informe (PDF, opcional)</label>
    <input id="archivo" type="file" accept="application/pdf,image/*">
    <iframe id="visorPdf" class="visor" style="display:none"></iframe>

    <button id="btnEnviar">Registrar entrenamiento completado</button>
    <p id="msgForm"></p>
  `;
  document.body.appendChild(formCard);

  // Vista previa local del PDF antes de enviarlo (visor de PDF)
  document.getElementById("archivo").addEventListener("change", (e) => {
    const file = e.target.files[0];
    const visor = document.getElementById("visorPdf");
    if (file && file.type === "application/pdf") {
      visor.src = URL.createObjectURL(file);
      visor.style.display = "block";
    } else {
      visor.style.display = "none";
    }
  });

  document.getElementById("btnEnviar").onclick = async () => {
    const datosTexto = document.getElementById("datos").value.trim();
    const codMat = document.getElementById("material").value || null;
    const archivo = document.getElementById("archivo").files[0];
    const msgForm = document.getElementById("msgForm");
    const btn = document.getElementById("btnEnviar");

    if (!datosTexto) {
      msgForm.innerHTML = `<span class="err">Ingresa los datos obtenidos.</span>`;
      return;
    }

    btn.disabled = true;
    btn.textContent = "Enviando…";

    let archivoUrl = null;
    if (archivo) {
      const ruta = `${equipoId}/${codigoAlumno}-${Date.now()}-${archivo.name}`;
      const { error: errSubida } = await supabase.storage.from("entregas").upload(ruta, archivo);

      if (errSubida) {
        msgForm.innerHTML = `<span class="err">No se pudo subir el archivo: ${errSubida.message}</span>`;
        btn.disabled = false;
        btn.textContent = "Registrar entrenamiento completado";
        return;
      }
      archivoUrl = supabase.storage.from("entregas").getPublicUrl(ruta).data.publicUrl;
    }

    const { error } = await supabase.from("registros_practica").insert({
      codAlumno: codigoAlumno,
      codigoEq: equipoId,
      codEv: practica.codEv,
      codMat,
      datos: { texto: datosTexto, archivo_url: archivoUrl }
    });

    btn.disabled = false;
    btn.textContent = "Registrar entrenamiento completado";
    msgForm.innerHTML = error
      ? `<span class="err">No se pudo registrar: ${error.message}</span>`
      : `<span class="ok">Entrenamiento registrado correctamente.${archivoUrl ? " Archivo adjuntado." : ""}</span>`;
  };
}

init();
</script>
</body>
</html>
